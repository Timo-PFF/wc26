name = "wc26-api"
main = "src/worker_v2.js"
compatibility_date = "2025-01-01"

# Non-secret config. The v2 (monolith) Worker serves every tournament and resolves
# each one's fixtures + snapshot from the committed manifest (data/tournaments.json)
# under this raw repo root — so adding a tournament needs no Worker/config change.
[vars]
REPO_BASE = "https://raw.githubusercontent.com/Timo-PFF/wc26/main/"

# D1 binding. For LOCAL dev (`wrangler dev` / `--local` execute) the id is ignored,
# so the placeholder is fine. Before deploying REMOTELY, run:
#   npx wrangler d1 create wc26
# and paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "wc26"
database_id = "f97f4801-1e75-4e67-b991-64bd45791be2"

# SESSION_SECRET is NOT set here (it's a secret). Local dev reads it from .dev.vars;
# for production run:  npx wrangler secret put SESSION_SECRET
